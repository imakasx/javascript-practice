<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Bind</title>
</head>
<body>
    <button>Click Button</button>
</body>
<script>
    class React{
        constructor(){
            this.library =  "React"
            this.server = "https://localHost//3000"

            document.querySelector('button')
            .addEventListener("click", this.handleClick.bind(this))

            // document.querySelector('button')
            // .addEventListener("click", this.handleClick)    //reference ke liye use bind(), and that stu. use .bind(this)
        }
        handleClick(){
            console.log(`Click Button`)
            console.log(this)
        }
    }

    const app = new React()
</script>
</html>
